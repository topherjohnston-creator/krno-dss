name: Update NBM Hazard Data

on:
  schedule:
    - cron: '*/5 * * * *'   # Every 5 minutes
  workflow_dispatch:        # Manual trigger from GitHub Actions tab

concurrency:
  group: nbm-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests scipy numpy

      - name: Run NBM processor
        run: python nbm_update.py

      - name: Commit updated JSON files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add threats.json timeline.json
          git diff --staged --quiet || git commit -m "Auto-update NBM hazard data $(date -u '+%Y-%m-%d %H:%MZ')"
          git fetch origin main
          git rebase -X ours origin/main
          git push origin main
