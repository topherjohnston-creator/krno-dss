<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRNO Dark Ops (Synced METAR & Time)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; background-color: #0f0f12; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .panel { background-color: #18181b; border: 1px solid #27272a; border-radius: 6px; display: flex; flex-direction: column; min-height: 200px; height: 100%; }
        .ops-card { position: relative; border-radius: 6px; background: #27272a; transition: all 0.2s ease; border: 1px solid transparent; cursor: crosshair; }
        .ops-card:hover { background: #3f3f46; border-color: #71717a; }
        .hazard-val { font-family: 'JetBrains Mono', monospace; font-size: 2.5rem; font-weight: 700; letter-spacing: -2px; line-height: 1; z-index: 10; position: relative; display: flex; align-items: flex-start; }
        .percent-sign { font-size: 1.2rem; margin-top: 6px; opacity: 0.7; margin-left: 2px; }
        .hazard-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #a1a1aa; z-index: 10; position: relative; line-height: 1.1; }
        .hazard-criteria { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: #71717a; margin-top: 2px; z-index: 10; position: relative; font-weight: 700; }
        .hazard-time { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; margin-top: 4px; z-index: 10; position: relative; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
        .watermark-icon { position: absolute; right: -8px; bottom: -8px; font-size: 4rem; opacity: 0.12; transform: rotate(-10deg); z-index: 0; pointer-events: none; }
        #global-tooltip { position: fixed; top: 0; left: 0; width: 260px; background-color: #09090b; border: 1px solid #52525b; color: #fff; padding: 12px; border-radius: 4px; font-size: 0.75rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.8); pointer-events: none; z-index: 9999; opacity: 0; transition: opacity 0.1s ease; transform: translate(15px, 15px); }
        #global-tooltip.visible { opacity: 1; }
        .timeline-row { display: flex; align-items: center; height: 100%; width: 100%; position: relative; z-index: 10; }
        .horizontal-guide { position: absolute; top: 50%; left: 0; right: 0; border-top: 1px dashed #52525b; opacity: 0.25; z-index: 0; pointer-events: none; }
        .bar-container { flex-grow: 1; height: 10px; border-radius: 0px; display: block; overflow: visible; position: relative; z-index: 10; } 
        .timeline-block { position: absolute; height: 100%; top: 0; display: block; border-radius: 0px; cursor: help; transition: opacity 0.1s; z-index: 30; }
        .timeline-block:hover { opacity: 0.85; z-index: 50; }
        .midnight-line { border-left: 1px solid #94a3b8; height: 100%; position: absolute; top: 0; z-index: 5; opacity: 0.3; }
        .midnight-label { position: absolute; top: -15px; transform: translateX(-50%); font-size: 10px; font-weight: bold; color: #94a3b8; background: #18181b; padding: 0 2px; }
        .day-segment { background-color: rgba(255, 255, 255, 0.03); } 
        .night-segment { background-color: rgba(0, 0, 0, 0.2); }      
        .asos-box { background: #27272a; border-radius: 4px; padding: 10px; display: flex; flex-direction: column; justify-content: flex-start; position: relative; overflow: hidden; }
        .asos-label { font-size: 0.7rem; color: #a1a1aa; text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 2px; z-index: 10; }
        .asos-value { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; color: white; font-weight: 700; leading: 1; z-index: 10; margin-top: auto; margin-bottom: auto;}
        .asos-sub { font-size: 0.75rem; color: #71717a; margin-top: 2px; z-index: 10; font-weight: 700; }
        .flight-cat { position: absolute; top: 10px; right: 10px; background: #22c55e; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 800; z-index: 10; }
        .threat-badge { position: absolute; top: 10px; right: 10px; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 800; z-index: 10; color: #18181b; }
        .wind-wrapper { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: 90px; }
        .wind-rose-svg { width: 100%; height: 100%; max-height: 110px; overflow: visible; display: block; }
        .wind-speed-row { font-family: 'JetBrains Mono', monospace; font-size: 1.3rem; font-weight: 800; color: white; line-height: 1; display: flex; align-items: baseline; justify-content: center; gap: 4px; }
    </style>
</head>
<body class="p-2 lg:p-4 h-screen box-border relative">

    <div id="global-tooltip"></div>

    <div class="grid grid-cols-1 lg:grid-cols-2 lg:grid-rows-2 gap-4 h-full">
        
        <div class="panel p-4" style="z-index: 20;"> 
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-3">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/7/79/NOAA_logo.svg" alt="NOAA" class="h-10 w-10">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/f/ff/US-NationalWeatherService-Logo.svg" alt="NWS" class="h-10 w-10">
                        <div class="flex flex-col justify-center ml-1">
                            <span class="text-[10px] font-bold text-slate-500 uppercase leading-none">National</span>
                            <span class="text-[10px] font-bold text-slate-500 uppercase leading-none">Weather Service</span>
                        </div>
                    </div>
                    <div class="h-8 w-px bg-slate-700"></div>
                    <h2 class="font-bold text-sm tracking-wider uppercase text-slate-400">Threat Matrix</h2>
                </div>
                <div class="flex items-center gap-2">
                    <div class="h-2 w-2 rounded-full bg-green-500 animate-pulse" id="live-dot"></div>
                    <span class="text-[10px] uppercase text-green-500 font-bold tracking-widest" id="live-label">Live</span>
                </div>
            </div>
            <div id="hazards-grid" class="grid grid-cols-5 gap-3 flex-grow h-full relative"></div>
            <div class="flex justify-end items-center mt-3 pt-2 border-t border-[#27272a] gap-4">
                 <div class="flex items-center gap-1.5 text-xs uppercase tracking-wider text-slate-400 font-bold"><div class="w-3 h-3" style="background-color: #3f3f46;"></div>None</div>
                 <div class="flex items-center gap-1.5 text-xs uppercase tracking-wider text-slate-400 font-bold"><div class="w-3 h-3" style="background-color: #6b7280;"></div>L-None</div>
                 <div class="flex items-center gap-1.5 text-xs uppercase tracking-wider text-slate-400 font-bold"><div class="w-3 h-3" style="background-color: #eab308;"></div>Minor</div>
                 <div class="flex items-center gap-1.5 text-xs uppercase tracking-wider text-slate-400 font-bold"><div class="w-3 h-3" style="background-color: #f97316;"></div>Mod</div>
                 <div class="flex items-center gap-1.5 text-xs uppercase tracking-wider text-slate-400 font-bold"><div class="w-3 h-3" style="background-color: #ef4444;"></div>Major</div>
                 <div class="flex items-center gap-1.5 text-xs uppercase tracking-wider text-slate-400 font-bold"><div class="w-3 h-3" style="background-color: #a855f7;"></div>Extreme</div>
            </div>
        </div>

        <div class="panel p-4" style="z-index: 10;">
            <div class="flex justify-between items-center mb-2">
                <h2 class="font-bold text-base tracking-wider uppercase text-slate-300">Timeline Analysis</h2>
                <p class="text-xs text-slate-400 font-mono font-bold" id="timestamp2"></p>
            </div>
            <div class="flex flex-col flex-grow h-full relative">
                <div class="flex flex-grow w-full relative">
                    <div id="timeline-labels" class="w-24 flex-shrink-0 flex flex-col justify-around pr-3 text-right z-20"></div>
                    <div class="flex-grow relative border-l border-[#27272a]">
                        <div id="timeline-bg" class="absolute inset-0 z-0 flex w-full h-full"></div>
                        <div id="timeline-lines" class="absolute inset-0 z-10 w-full h-full pointer-events-none"></div>
                        <div id="timeline-bars" class="absolute inset-0 z-20 flex flex-col justify-around py-1 pl-1 pointer-events-none"></div>
                    </div>
                </div>
                <div class="h-10 flex w-full pl-24 relative mt-1"><div id="timeline-axis" class="w-full h-full relative text-xs text-slate-400"></div></div>
            </div>
        </div>

        <div class="panel p-4" style="z-index: 10;">
            <div class="flex justify-between items-center mb-3">
                 <div class="flex items-center gap-3">
                    <h2 class="font-bold text-base tracking-wider uppercase text-slate-300">CURRENT OBSERVATIONS</h2>
                    <span class="text-xs font-mono text-purple-400 bg-purple-400/10 px-2 py-0.5 rounded border border-purple-400/20">KRNO</span>
                 </div>
                 <div class="text-[10px] text-slate-500 font-mono" id="asos-time">FETCHING...</div>
            </div>
            <div class="flex-grow flex flex-col gap-3">
                <div class="flex-1 grid grid-cols-4 gap-3">
                    <div class="asos-box relative">
                        <div class="asos-label absolute top-2 left-2">WIND</div>
                        <div class="threat-badge threat-minor">X-WIND</div>
                        <div class="wind-wrapper pt-3">
                            <svg class="wind-rose-svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#52525b" stroke-width="1.5" />
                                <g id="wind-arrow" transform="rotate(0, 50, 50)"><path d="M50 45 L45 35 L50 38 L55 35 Z" fill="#fbbf24" /><line x1="50" y1="5" x2="50" y2="38" stroke="#fbbf24" stroke-width="2" /></g>
                            </svg>
                        </div>
                        <div class="wind-stats pb-1 text-center"><div class="wind-speed-row"><span id="w-spd">--</span><span class="text-xs text-gray-500 self-center">G</span><span id="w-gst">--</span></div><div class="text-[10px] text-gray-400" id="w-dir">--°</div></div>
                    </div>
                    <div class="asos-box"><div class="asos-label">VISIBILITY</div><div class="asos-value" id="vis-val">-- SM</div><div class="asos-sub" id="wx-val">NONE</div></div>
                    <div class="asos-box"><div class="flight-cat" id="f-cat">VFR</div><div class="asos-label">CEILING</div><div class="asos-value" id="sky-val">CLR</div><div class="asos-sub" id="sky-sub">CLEAR</div></div>
                    <div class="asos-box"><div class="asos-label">TEMP / DEW</div><div class="asos-value"><span id="t-val">--</span><span class="text-lg text-gray-500">/</span><span id="d-val">--</span><span class="text-sm align-top text-gray-500">°F</span></div><div class="asos-sub" id="rh-val">RH --%</div></div>
                </div>
                <div class="flex-1 bg-black rounded p-3 font-mono text-xs text-green-400 border border-gray-800"><p id="metar-string">LOADING METAR...</p></div>
            </div>
        </div>

        <div class="panel p-4 flex flex-col" style="z-index: 20;">
            <div class="flex justify-between items-center mb-2"><h2 id="wwa-title-text" class="font-bold text-base uppercase text-slate-300">Active Advisories</h2></div>
            <div id="wwa-container" class="space-y-2 overflow-y-auto flex-grow pr-1"></div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://factsheet-aim-washstand.ngrok-free.dev"; 
        const TOTAL_HOURS = 48; 
        let globalNow = new Date(); 

        const RISK_LEVELS = {
            5: { name: "Extreme", color: '#a855f7', textColor: '#ffffff' }, 4: { name: "Major", color: '#ef4444', textColor: '#ffffff' },   
            3: { name: "Moderate", color: '#f97316', textColor: '#ffffff' }, 2: { name: "Minor", color: '#eab308', textColor: '#000000' },   
            1: { name: "Little to None", color: '#6b7280', textColor: '#ffffff' }, 0: { name: "None", color: '#3a3a3a', textColor: '#71717a' } 
        };

        const HAZARD_DETAILS = [
            { id: 'Wind', icon: "ph-wind", prep: "Debris/high-profile vehicles" },
            { id: 'Lightning', icon: "ph-lightning", prep: "Ramp/safety closure" },
            { id: 'Hail', icon: "ph-cloud-snow", prep: "Asset damage" },
            { id: 'Snow', icon: "ph-snowflake", prep: "Plow operations" },
            { id: 'Visibility', icon: "ph-eye", prep: "Driver disorientation" },
            { id: 'FZRA', icon: "ph-cloud-snow", timelineName: "FRZ RAIN", prep: "Chemical treatment" },
            { id: 'FlashFreeze', icon: "ph-thermometer-cold", timelineName: "FLASH FRZ", prep: "Chemical treatment efficacy" },
            { id: 'Rain', icon: "ph-drop", prep: "Drainage capacity" },
            { id: 'Flooding', icon: "ph-waves", prep: "Drainage capacity" },
            { id: 'Temp', icon: "ph-thermometer", prep: "Frostbite/safety" }
        ];

        const tooltip = document.getElementById('global-tooltip');
        document.addEventListener('mousemove', (e) => {
            if (tooltip.classList.contains('visible')) {
                tooltip.style.left = `${e.clientX + 15}px`; tooltip.style.top = `${e.clientY + 15}px`;
            }
        });
        function showTooltip(html) { tooltip.innerHTML = html; tooltip.classList.add('visible'); }
        function hideTooltip() { tooltip.classList.remove('visible'); }

        window.showHourTooltip = function(offset) {
            const d = new Date(globalNow.getTime() + offset * 3600000);
            showTooltip(`<div class="font-bold border-b border-gray-600 mb-1 pb-1 text-center">TIME INSPECTION (+${offset}h)</div><div class="text-sm font-mono text-center text-white">${d.toLocaleString()}</div>`);
        };

        function getHazardTimeString(h_id, refsTimeline) {
            if (!refsTimeline) return "";
            const mapping = { 'Temp': 'COLD_HEAT', 'FlashFreeze': 'FLASH_FREEZE', 'Flooding': 'RAIN' };
            const tData = refsTimeline[mapping[h_id] || h_id.toUpperCase()];
            let maxR = 0; for(let i=1; i<=48; i++) if(tData[i]?.risk > maxR) maxR = tData[i].risk;
            if(maxR < 1) return ""; 
            let start = -1, end = -1;
            for(let i=1; i<=48; i++) if(tData[i]?.risk === maxR) { if(start === -1) start = i; end = i; }
            const d1 = new Date(globalNow.getTime() + start * 3600000);
            const d2 = new Date(globalNow.getTime() + end * 3600000);
            const fmt = d => `${d.toLocaleDateString('en-US', {weekday:'short'}).toUpperCase()} ${d.getHours() % 12 || 12}${d.getHours() >= 12 ? 'P' : 'A'}`;
            return start === end ? fmt(d1) : `${fmt(d1)} - ${fmt(d2)}`;
        }

        async function fetchMETAR() {
            try {
                const resp = await fetch('https://api.weather.gov/stations/KRNO/observations/latest');
                const data = await resp.json();
                const p = data.properties;
                document.getElementById('w-spd').textContent = Math.round(p.windSpeed.value * 1.94);
                document.getElementById('w-gst').textContent = p.windGust.value ? Math.round(p.windGust.value * 1.94) : '--';
                document.getElementById('w-dir').textContent = p.windDirection.value + '°';
                document.getElementById('wind-arrow').setAttribute('transform', `rotate(${p.windDirection.value}, 50, 50)`);
                document.getElementById('t-val').textContent = Math.round(p.temperature.value * 9/5 + 32);
                document.getElementById('d-val').textContent = Math.round(p.dewpoint.value * 9/5 + 32);
                document.getElementById('metar-string').textContent = p.rawMessage;
                document.getElementById('asos-time').textContent = 'UPDATED ' + new Date(p.timestamp).toLocaleTimeString();
            } catch(e) {}
        }

        async function initDashboard() {
            globalNow = new Date();
            document.getElementById('timestamp2').textContent = globalNow.toLocaleString();
            fetchMETAR();
            
            const fetchOpts = { headers: { "ngrok-skip-browser-warning": "true" } };
            try {
                const [threatsR, timelineR] = await Promise.all([
                    fetch(`${BACKEND_URL}/api/threats`, fetchOpts).then(r => r.json()),
                    fetch(`${BACKEND_URL}/api/timeline`, fetchOpts).then(r => r.json())
                ]);

                const refsThreats = threatsR.threats;
                const refsTimeline = timelineR.timeline;
                const grid = document.getElementById('hazards-grid');
                grid.innerHTML = '';

                const hazardMapping = { 'Temp': 'COLD_HEAT', 'FlashFreeze': 'FLASH_FREEZE', 'Flooding': 'RAIN' };
                const hazards = HAZARD_DETAILS.map(h => {
                    const key = hazardMapping[h.id] || h.id.toUpperCase();
                    return { ...h, prob: refsThreats[key]?.prob || 0, risk: refsThreats[key]?.risk || 0, metric: refsThreats[key]?.metric || 'None', label: refsThreats[key]?.name || h.id };
                }).sort((a,b) => b.risk - a.risk || b.prob - a.prob);

                hazards.forEach(h => {
                    const config = RISK_LEVELS[h.risk];
                    const card = document.createElement('div');
                    card.className = 'ops-card flex flex-col justify-between p-3';
                    card.style.borderTop = `4px solid ${config.color}`;
                    card.innerHTML = `
                        <div class="hazard-val" style="color:${h.risk === 0 ? '#52525b' : '#fff'}">${h.prob}<span class="percent-sign">%</span></div>
                        <div class="mt-1"><div class="hazard-label">${h.label}</div><div class="hazard-criteria">${h.metric}</div>
                        <div class="hazard-time" style="color:${config.color}">${getHazardTimeString(h.id, refsTimeline)}</div></div>
                        <i class="ph ${h.icon} watermark-icon" style="color:${config.color}"></i>`;
                    grid.appendChild(card);
                });

                // Timeline
                const barsCtx = document.getElementById('timeline-bars');
                const labelsCtx = document.getElementById('timeline-labels');
                barsCtx.innerHTML = ''; labelsCtx.innerHTML = '';
                HAZARD_DETAILS.forEach(h => {
                    labelsCtx.innerHTML += `<div class="h-full flex items-center justify-end text-[10px] font-bold text-slate-400 uppercase tracking-tighter">${h.timelineName || h.id}</div>`;
                    let row = `<div class="timeline-row"><div class="horizontal-guide"></div><div class="bar-container">`;
                    for(let i=1; i<=48; i++) {
                        const r = refsTimeline[hazardMapping[h.id] || h.id.toUpperCase()][i].risk;
                        row += `<div class="timeline-block" style="left:${(i-1)/48*100}%; width:${100/48}%; background-color:${RISK_LEVELS[r].color}"></div>`;
                    }
                    barsCtx.innerHTML += row + `</div></div>`;
                });
            } catch(e) { console.error(e); }
        }

        initDashboard();
        setInterval(initDashboard, 300000);
    </script>
</body>
</html>
